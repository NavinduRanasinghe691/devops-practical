name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:        # lets you re-run it from the Actions tab

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run PyTest
        run: pytest

  # Catches a broken Dockerfile in CI instead of discovering it on Render
  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t flask-app:ci .
